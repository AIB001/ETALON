[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "molquarry"
version = "0.5.0"
description = "Agent-friendly discovery, queries and reproducible downloads for CADD data sources"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3"]

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1.2,<2"]
verify = ["pyarrow>=18,<24", "ord-schema>=0.8,<1"]
deliverables = ["rdkit>=2025.3,<2027", "gemmi>=0.7,<0.8", "biopython>=1.85,<2", "numpy>=1.26,<3",
                "openpyxl>=3.1,<4"]

[project.scripts]
molquarry = "molquarry.cli:main"
molquarry-mcp = "molquarry.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/molquarry"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "molquarry/skill_resources"

[tool.hatch.build.targets.sdist]
exclude = ["/examples/mtdh_snd1/output"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".molquarry"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
