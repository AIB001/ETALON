# ETALON is a measuring instrument, so its own build is declared rather than implied.
# Before this file existed the package imported only through a sys.path insert in each
# test, which works until something imports etalon from anywhere else.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "etalon"
version = "0.1.0"
description = "Evidence-governed active learning across composable CADD protocols"
requires-python = ">=3.11"
# Deliberately empty. ETALON's boundary layer shells out to GROMACS and reads MolCascade
# and PRISM as vendored assets with their own environments; declaring those here would
# assert a single resolvable dependency set that does not exist. The asset manifest
# records what is actually pinned.
dependencies = []

[project.scripts]
# So `etalon plan` works once installed. The module entry point is the supported path either way:
# python -m etalon needs no install, which matters for a tool whose first job is to be argued with.
etalon = "etalon.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]
mcp = ["mcp>=1.12,<2"]
llm = ["httpx>=0.27,<1"]
active = ["numpy>=1.24", "scipy>=1.10"]
molecules = ["numpy>=1.26", "scipy>=1.10", "rdkit>=2024.9", "pydantic>=2.10,<3"]
cascade = [
    "numpy>=1.26", "scipy>=1.10", "rdkit>=2024.9", "pydantic>=2.10,<3",
    "pyarrow>=17,<26", "PyYAML>=6,<7", "openpyxl>=3.1,<4",
]
quarry = ["httpx>=0.27,<1", "pydantic>=2.10,<3"]
quarry-deliverables = [
    "httpx>=0.27,<1", "pydantic>=2.10,<3", "rdkit>=2025.3,<2027",
    "gemmi>=0.7,<0.8", "biopython>=1.85,<2", "numpy>=1.26,<3", "openpyxl>=3.1,<4",
]
# Combine with [cascade] for the actual MolCascade feature and predictor pipeline.
# Kept optional: numerical active learning does not require ONNX export or inference.
bundles = ["scikit-learn>=1.3", "skl2onnx>=1.20,<2", "onnxruntime>=1.23,<2"]
# What the test suite actually needs, which was not the same as what it declared. `dependencies`
# above is empty on purpose and stays empty -- every third-party import in src/ is function-local, so
# the package imports on the standard library alone and the planning CLI runs with nothing installed.
# The tests are a different question and were answering it by accident: they need numpy, scikit-learn
# and RDKit outright, torch for the GPU featuriser's parity checks, and the vendored MolCascade needs
# pydantic v2 -- an environment with v1 skipped a test that was reported as a pass count of 277.
# Declared here so "no GPU, no AmberTools, no network, no API key" describes a suite somebody else
# can actually make green.
test = [
    "pytest>=7",
    "httpx>=0.27,<1",
    "mcp>=1.12,<2",
    "numpy>=1.26",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "rdkit>=2024.9",
    "pydantic>=2.10,<3",
    "pyarrow>=17,<26",
    "PyYAML>=6,<7",
    "openpyxl>=3.1,<4",
    # Optional: the GPU featuriser's parity and binning tests skip without it, and the binning one
    # runs on CPU, so torch is worth having even on a machine with no CUDA device.
    "torch>=2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/etalon"]

[tool.hatch.build.targets.wheel.force-include]
".claude/skills/etalon-campaign/SKILL.md" = "etalon/mcp/skills/campaign.md"
"asset" = "etalon/_assets"

[tool.hatch.build]
exclude = ["**/__pycache__/**", "**/*.pyc"]

[tool.pytest.ini_options]
# So the tests import the package rather than a path they had to patch themselves.
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
# The width the code is already written at, declared rather than left to a default that
# disagrees with it. Picked from the existing sources, not imposed on them.
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH"]
ignore = [
    # A band, a digest or a measured value belongs on one line even when it runs long;
    # E501 is checked in CI-by-eye rather than enforced, because wrapping a recorded
    # number is worse than reading a wide line.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests name their fixtures in the signature and pytest supplies them, and a test double
# implementing a protocol has to accept the arguments the protocol names whether it reads them
# or not -- a transport that ignores the prompt is the point of that double. ARG005 is the same
# case for a lambda: a stand-in for the ExpensiveStage protocol takes (allowed, cheap) because the
# protocol says so, and renaming them to underscores would hide which seam is being exercised.
"tests/*" = ["ARG001", "ARG002", "ARG005"]
